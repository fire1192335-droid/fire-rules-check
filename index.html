<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>本工具已暫停使用</title>
  <meta name="theme-color" content="#c0392b" />
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; background: #f4f6f8; color: #211f1e; }
    main { max-width: 560px; margin: 0 auto; padding: 48px 16px; line-height: 1.7; }
    h1 { color: #9c2b1f; font-size: 1.5rem; }
    .box { background: #fff; border-left: 6px solid #c0392b; padding: 16px 20px; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>場所消防設備與無開口樓層法定判定系統：已暫停使用</h1>
    <div class="box">
      <p>經逐條核對《各類場所消防安全設備設置標準》（民國 113 年 4 月 24 日修正），本工具舊版存在條號引用錯誤與判定條件缺漏，結果不可作為檢討依據，故暫停提供。</p>
      <p>請改以現行法規逐條檢討：<a href="https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120029">全國法規資料庫</a>。</p>
    </div>
  </main>
  <script>
    // 解除舊版離線快取（已加到主畫面的裝置）。
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
    }
    if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
  </script>
</body>
</html>
